<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<!-- Flip Wits mark, after the iOS app icon: a white rounded 42 on a near-black tile, with the green "got it" bar under it.
     The digits are round-capped strokes, not text, so the icon never depends on a font.
     Sized for a 16 px tab: one viewBox unit is half a pixel there, so the digits are drawn larger and bolder than in the
     app icon, the 4 sits a little left so its crossbar clears the 2, and the bar spans whole pixels (y 24 to 26). -->
<rect width="32" height="32" rx="7" fill="#0B0B0F"/>
<path d="M11.5 20.5V6.5L4.5 16.5H14" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M18.5 10.5Q19 6.5 23 6.5Q27.5 6.5 27.5 11Q27.5 13.5 24.5 15.8L18.5 20.5H27.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="8" y="24" width="16" height="2" rx="1" fill="#1FB889"/>
</svg>
